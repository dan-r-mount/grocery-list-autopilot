name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @gla/shared build
      - run: pnpm typecheck
      - run: pnpm test:vault
      - run: pnpm --filter @gla/api test:profile
      - run: pnpm milk:resolve
      - run: pnpm milk:push
